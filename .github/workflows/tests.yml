name: tests

on:
  pull_request:
    branches:
      - dev
      - staging
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build production assets
        if: github.base_ref == 'staging' || github.base_ref == 'main'
        run: pnpm run build

      - name: Run Type Analysis
        run: |
          composer types:check
          pnpm run types:check

      - name: Install rsync
        run: |
          # rsync is no longer preinstalled on the ubuntu-latest (24.04) image,
          # but deploy.sh's binary guard requires it, so the deployment tests
          # exercise that guard. Install it explicitly.
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Run deployment tests
        run: |
          echo "=== binary availability (deploy.sh guard) ==="
          for b in git composer pnpm ssh rsync tar sha256sum; do
            echo "$b: $(command -v "$b" || echo MISSING)"
          done
          echo "=== running deploy tests (verbose) ==="
          bash -x tests/Deployment/deploy_test.sh 2>&1 | tail -60 || true
          echo "=== authoritative run ==="
          composer test:deploy

      - name: Tests
        run: php artisan test
